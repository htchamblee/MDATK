# Stand-alone builds of MDATK: Linux AppImage and Windows 10/11 x64 (beta).
#
# - Push of a tag v* (e.g. v0.0.4.1, also made by publishing a release with a new tag): builds
#   both, tests them and attaches them to the GitHub release for the tag (created if needed).
#   Nothing is attached unless every build and test passed.
# - Push to a branch that changes the packaging, or a manual run (Actions -> Release builds ->
#   Run workflow): builds and tests only; the files are the run's artifacts.
#
# Local builds and what is bundled: packaging/README.md.
name: Release builds

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:  # branch pushes only (tag pushes ignore path filters)
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Linux AppImage (built on Rocky Linux 9)
    # built on the oldest supported distribution, because the AppImage needs at least its glibc:
    # RHEL / Rocky 9 has glibc 2.34 (Ubuntu 22.04: 2.35). Python 3.12 and GTK 3 are Rocky's own.
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: System packages (Python 3.12, GTK 3 and the headers PyGObject builds against)
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=install_weak_deps=False \
            python3.12 python3.12-devel python3.12-pip gcc pkgconf-pkg-config \
            gobject-introspection-devel cairo-devel cairo-gobject-devel gtk3 \
            librsvg2 adwaita-icon-theme hicolor-icon-theme dejavu-sans-fonts \
            xorg-x11-server-Xvfb xorg-x11-xauth binutils file desktop-file-utils \
            findutils which tar xz
          python3.12 -m venv /opt/mdatk-build
          echo /opt/mdatk-build/bin >> "$GITHUB_PATH"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          # PyGObject 3.51+ needs girepository-2.0 (GLib 2.80), newer than Rocky 9's GLib 2.68
          python -m pip install "PyGObject>=3.42,<3.51" "pycairo>=1.20" pyinstaller
          python -m pip install .                   # MDATK's dependencies ...
          python -m pip uninstall -y mdatk          # ... the bundle uses the checked-out source
          python -m pip install mdtraj future
          python -m pip install --no-deps barnaba   # barnaba.annotate needs neither scikit-learn nor pandas
          python -m pip list

      - name: Version check
        run: |
          version="$(python -c 'import mdatk; print(mdatk.__version__)')"
          echo "MDATK $version"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} does not match mdatk.__version__ ${version}"
          fi

      - name: Build the AppImage
        env:
          PYTHON: python
        run: packaging/linux/build_appimage.sh --out dist

      - name: glibc check (at most 2.34, RHEL 9)
        run: packaging/linux/check_glibc.sh build/appimage/dist/mdatk 2.34

      - name: Smoke test (headless; GUI under Xvfb)
        run: |
          xvfb-run -a python packaging/smoke_test.py dist/MDATK-*-x86_64.AppImage --work /tmp/smoke \
            --render --bundled-ffmpeg --barnaba --gui 20

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdatk-linux-x86_64
          path: dist/MDATK-*-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0  # already compressed

  rhel9:
    name: AppImage test on a clean Rocky Linux 9 (RHEL 9)
    needs: appimage
    runs-on: ubuntu-latest
    container: rockylinux:9
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdatk-linux-x86_64
          path: dist

      - name: Test packages (no GTK, the AppImage brings its own)
        run: dnf install -y python3 xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-fonts findutils which

      - name: Smoke test
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a python3 packaging/smoke_test.py dist/MDATK-*-x86_64.AppImage --work /tmp/smoke \
            --render --bundled-ffmpeg --barnaba --gui 20

  ubuntu2204:
    name: AppImage test on Ubuntu 22.04
    needs: appimage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mdatk-linux-x86_64
          path: dist

      - name: Test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Smoke test
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a python3 packaging/smoke_test.py dist/MDATK-*-x86_64.AppImage --work smoke \
            --render --bundled-ffmpeg --barnaba --gui 20

  windows:
    name: Windows x64 (MSYS2 UCRT64, beta)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: curl

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build (dependencies, PyInstaller bundle, zip, installer)
        run: packaging/windows/build_windows.sh --install-deps --out dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Smoke test (outside MSYS2, so only the bundle's own DLLs are used)
        shell: pwsh
        run: |
          $exe = "build\windows\dist\mdatk\mdatk.exe"
          $opts = @("--work", "smoke", "--render", "--bundled-ffmpeg")
          if (Get-ChildItem "build\windows\dist\mdatk\_internal" -Filter "barnaba-*.dist-info" -ErrorAction SilentlyContinue) {
            $opts += "--barnaba"
          } else {
            Write-Output "::warning::the Windows build has no barnaba (mdtraj / barnaba did not install)"
          }
          python packaging/smoke_test.py $exe @opts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdatk-windows-x64
          path: |
            dist/MDATK-*-windows-x64.zip
            dist/MDATK-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    # tags only, and only when every build and test passed: no half-empty releases
    needs: [appimage, rhel9, ubuntu2204, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mdatk-*
          path: release
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd release
          ls -l
          sha256sum MDATK-* > SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## MDATK ${version}: stand-alone builds"
            echo
            echo "No Python, conda or virtual environment needed. cpptraj (AmberTools) is not included:"
            echo "install AmberTools yourself for trajectory cleaning; MDATK finds it automatically."
            echo
            echo "**Linux** (x86-64; Ubuntu 22.04, RHEL / Rocky / Alma 9 or newer): \`MDATK-${version}-x86_64.AppImage\`"
            echo '```'
            echo "chmod +x MDATK-${version}-x86_64.AppImage"
            echo "./MDATK-${version}-x86_64.AppImage            # the interface"
            echo "./MDATK-${version}-x86_64.AppImage --help     # the command line"
            echo '```'
            echo "Built on Rocky Linux 9; smoke-tested (CLI, video, GUI start) on clean Rocky Linux 9 and Ubuntu 22.04."
            echo
            echo "**Windows 10/11 x64 - beta, untested on real machines**: \`MDATK-${version}-windows-x64-setup.exe\`"
            echo "(installer) or \`MDATK-${version}-windows-x64.zip\` (unzip, run \`mdatk-gui.exe\`)."
            echo "The generated workflow scripts are bash scripts: run them on Linux, a cluster or in WSL."
            echo "Only the automated smoke test (CLI demo, analysis and video on a CI machine) has passed."
            echo
            echo "Licences: MDATK is GPL v3. The builds include third-party software (Python, GTK 3,"
            echo "NumPy, SciPy, Matplotlib, MDAnalysis, Barnaba, a GPL build of FFmpeg ...); their"
            echo "licences and source pointers are in the \`licenses\` folder of each build."
            echo "Checksums: \`SHA256SUMS.txt\`."
          } > ../release_notes.md
          cat ../release_notes.md

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body_path: release_notes.md
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
